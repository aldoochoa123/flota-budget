name: Explorar Intranet Taller
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/scrap-taller.yml'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Login y exploración de la intranet
        env:
          BUDGET_USER: ${{ secrets.BUDGET_USER }}
          BUDGET_PASS: ${{ secrets.BUDGET_PASS }}
        run: |
          node -e "
          const USUARIO = process.env.BUDGET_USER;
          const PASSWORD = process.env.BUDGET_PASS;
          if (!USUARIO || !PASSWORD) { console.error('Faltan credenciales'); process.exit(1); }
          
          const BASE = 'https://intranet.budgetperu.com/hiker';
          
          async function login() {
            const r0 = await fetch(BASE + '/auth/login', { redirect: 'manual', signal: AbortSignal.timeout(15000) });
            const html0 = await r0.text();
            const cookies0 = r0.headers.getSetCookie?.() || [];
            const cookieStr = cookies0.map(c => c.split(';')[0]).join('; ');
            const csrfMatch = html0.match(/name=\"_token\"[^>]*value=\"([^\"]*)\"/) || html0.match(/value=\"([^\"]*)\"[^>]*name=\"_token\"/);
            const csrf = csrfMatch ? csrfMatch[1] : '';
            
            const body = new URLSearchParams();
            body.append('identity', String(USUARIO));
            body.append('password', String(PASSWORD));
            body.append('_token', csrf);
            
            const r1 = await fetch(BASE + '/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Cookie': cookieStr },
              body: body.toString(),
              redirect: 'manual',
              signal: AbortSignal.timeout(15000),
            });
            const sc = r1.headers.getSetCookie?.() || [];
            let allCookies = [...cookies0, ...sc].map(c => c.split(';')[0]).join('; ');
            
            // Follow redirects
            let loc = r1.headers.get('location') || '';
            if (r1.status >= 300 && loc) {
              for (let i = 0; i < 5 && loc; i++) {
                const url = loc.startsWith('http') ? loc : BASE + loc;
                const rx = await fetch(url, { headers: { Cookie: allCookies }, redirect: 'manual', signal: AbortSignal.timeout(10000) });
                const nx = rx.headers.getSetCookie?.() || [];
                allCookies = [...allCookies.split('; '), ...nx.map(c => c.split(';')[0])].filter(c => c.includes('=')).join('; ');
                loc = rx.headers.get('location') || '';
                if (rx.status >= 200 && rx.status < 400) {
                  const finalHtml = await rx.text();
                  // Extract sidebar links from the final page
                  const links = [...finalHtml.matchAll(/href=\"([^\"]*)\"[^>]*>([^<]*)/g)]
                    .filter(m => m[1].includes('/hiker/'))
                    .map(m => ({ href: m[1], text: m[2].trim() }));
                  const unique = [...new Map(links.map(l => [l.href, l])).values()];
                  console.log('=== SIDEBAR LINKS (' + unique.length + ') ===');
                  unique.forEach(l => console.log('  ' + l.text.padEnd(45) + ' → ' + l.href));
                  break;
                }
              }
            }
            return allCookies;
          }
          
          async function explore(cookies, path) {
            try {
              const r = await fetch(BASE + path, { headers: { Cookie: cookies, 'X-Requested-With': 'XMLHttpRequest' }, redirect: 'manual', signal: AbortSignal.timeout(10000) });
              if (r.status === 302) {
                const loc = r.headers.get('location') || '';
                if (loc.includes('/login')) return null; // not auth'd
                return { path, status: 302, redirect: loc };
              }
              const txt = await r.text();
              const isJson = txt.trim().startsWith('{') || txt.trim().startsWith('[');
              return { path, status: r.status, size: txt.length, json: isJson, snippet: txt.slice(0, 150).replace(/\s+/g, ' ') };
            } catch (e) {
              return { path, error: e.message };
            }
          }
          
          async function main() {
            console.log('[1] Logging in...');
            const cookies = await login();
            console.log('[Login cookies]', cookies.slice(0, 200));
            
            console.log('\n=== PHASE 1: Rutas ControlCar (fuzzing) ===');
            const controlPaths = [
              '/ControlCar', '/ControlCar/flota', '/ControlCar/flotaBase', '/ControlCar/flotaBaseCompleta',
              '/ControlCar/base', '/ControlCar/mantenimiento', '/ControlCar/maintenance',
              '/ControlCar/taller', '/ControlCar/workshop', '/ControlCar/servicios',
              '/ControlCar/proximoServicio', '/ControlCar/proximoMantenimiento', '/ControlCar/proximos',
              '/ControlCar/alertas', '/ControlCar/vencimientos', '/ControlCar/soat', '/ControlCar/rt',
              '/ControlCar/revisionTecnica', '/ControlCar/documentos', '/ControlCar/repuestos',
              '/ControlCar/ordenes', '/ControlCar/ordenesTrabajo', '/ControlCar/workOrders',
              '/ControlCar/historial', '/ControlCar/historico', '/ControlCar/reportes', '/ControlCar/reports',
              '/ControlCar/movimientos', '/ControlCar/movimientosLista', '/ControlCar/listMovimientos',
              '/ControlCar/reporteMovimientos', '/ControlCar/getMovimientos/1063', '/ControlCar/movimientos/1063',
              '/ControlCar/movimiento', '/ControlCar/salidas', '/ControlCar/ingresos',
              '/ControlCar/validateExistence/1063', '/ControlCar/validateExistence',
              '/ControlCar/unidades', '/ControlCar/vehiculos', '/ControlCar/vehicles',
              '/ControlCar/costos', '/ControlCar/gastos', '/ControlCar/combustible', '/ControlCar/fuel',
              '/ControlCar/seguros', '/ControlCar/impuestos', '/ControlCar/revisiones',
              '/ControlCar/inspecciones', '/ControlCar/inspections', '/ControlCar/fotos',
              '/ControlCar/images', '/ControlCar/documents', '/ControlCar/search', '/ControlCar/buscar',
              '/ControlCar/consulta', '/ControlCar/consultaUnidad', '/ControlCar/consultaPlaca', '/ControlCar/consultaRA',
              '/ControlCar/estadisticas', '/ControlCar/dashboard', '/ControlCar/inicio', '/ControlCar/index',
              '/ControlCar/main', '/ControlCar/admin', '/ControlCar/config', '/ControlCar/configuracion',
              '/ControlCar/settings', '/ControlCar/inAndOut/0', '/ControlCar/inAndOut/1',
              '/ControlCar/inAndOut/list', '/ControlCar/buscarRa',
              '/ControlCar/api', '/ControlCar/api/flota', '/ControlCar/api/vehiculos',
              '/ControlCar/api/movimientos', '/ControlCar/api/taller', '/ControlCar/api/alertas',
              '/ControlCar/api/vencimientos', '/ControlCar/api/proximos', '/ControlCar/api/reportes',
              '/ControlCar/api/servicios', '/ControlCar/api/unidades',
              '/ControlCar/getFlota', '/ControlCar/getUnidades', '/ControlCar/getVehiculos',
              '/ControlCar/getAlertas', '/ControlCar/getVencimientos', '/ControlCar/getProximos',
              '/ControlCar/getReportes', '/ControlCar/getServicios', '/ControlCar/getMantenimientos',
              '/ControlCar/getTaller', '/ControlCar/getHistorial', '/ControlCar/getCostos',
              '/ControlCar/getDocumentos', '/ControlCar/getInspecciones',
              '/ControlCar/exportFlota', '/ControlCar/exportPdf', '/ControlCar/export',
              '/ControlCar/tallerLista', '/ControlCar/tallerMovimientos',
              '/ControlCar/proximosServicios', '/ControlCar/proximosVencimientos',
              '/ControlCar/proximosMantenimientos', '/ControlCar/alertasVencimiento',
              '/ControlCar/unidad/1063', '/ControlCar/unidad?id=1063',
              '/ControlCar/vehicle/1063', '/ControlCar/vehicle?id=1063',
            ];
            
            const found = [];
            for (const p of controlPaths) {
              const r = await explore(cookies, p);
              if (r && (r.status !== 302 || !r.redirect?.includes('/login'))) {
                found.push(r);
                console.log('  ✅ ' + r.path + ' → ' + r.status + ' | ' + (r.size || 0) + ' bytes' + (r.json ? ' [JSON]' : ''));
                if (r.snippet) console.log('    "' + r.snippet.slice(0, 150) + '"');
                if (r.redirect) console.log('    → ' + r.redirect);
              }
            }
            
            console.log('\n=== PHASE 2: Rutas raíz y API ===');
            const rootPaths = [
              '/', '/dashboard', '/home', '/inicio', '/api', '/api/flota', '/api/vehiculos',
              '/api/movimientos', '/api/taller', '/api/alertas', '/api/vencimientos',
              '/api/proximos', '/api/reportes', '/api/servicios', '/api/unidades',
              '/api/flotaBase', '/api/base', '/api/consultas',
              '/taller', '/mantenimiento', '/servicios', '/reportes', '/alertas',
              '/vencimientos', '/ordenes', '/repuestos', '/documentos',
              '/flota', '/vehiculos', '/unidades', '/movimientos',
              '/json', '/json/flota', '/json/vehiculos', '/json/unidades',
              '/export', '/export/flota', '/export/pdf',
            ];
            for (const p of rootPaths) {
              const r = await explore(cookies, p);
              if (r && (r.status !== 302 || !r.redirect?.includes('/login'))) {
                found.push(r);
                console.log('  ✅ ' + r.path + ' → ' + r.status + ' | ' + (r.size || 0) + ' bytes' + (r.json ? ' [JSON]' : ''));
                if (r.snippet) console.log('    "' + r.snippet.slice(0, 150) + '"');
                if (r.redirect) console.log('    → ' + r.redirect);
              }
            }
            
            console.log('\n=== PHASE 3: POST endpoints ===');
            const postEndpoints = [
              ['/ControlCar/validateExistence/', 'unidad=1063'],
              ['/ControlCar/validateExistence/', 'unit=1063'],
              ['/ControlCar/getMovimientos/', 'unidad=1063'],
              ['/ControlCar/getMovimientos/', 'unit=1063'],
              ['/ControlCar/listMovimientos/', 'unidad=1063'],
              ['/ControlCar/reportes/', 'unidad=1063'],
              ['/ControlCar/search/', 'q=1063'],
              ['/ControlCar/search/', 'search=1063'],
              ['/ControlCar/buscar/', 'q=1063'],
              ['/ControlCar/buscarRa/', 'q=1063'],
              ['/ControlCar/flotaBusqueda/', 'q=1063'],
              ['/ControlCar/getFlota/', ''],
              ['/ControlCar/getUnidades/', ''],
              ['/ControlCar/getAlertas/', ''],
              ['/ControlCar/getVencimientos/', ''],
              ['/ControlCar/getProximos/', 'unidad=1063'],
              ['/ControlCar/getServicios/', 'unidad=1063'],
              ['/ControlCar/getMantenimientos/', 'unidad=1063'],
              ['/ControlCar/getTaller/', ''],
              ['/ControlCar/getHistorial/', 'unidad=1063'],
              ['/ControlCar/getDocumentos/', 'unidad=1063'],
              ['/ControlCar/getInspecciones/', 'unidad=1063'],
              ['/ControlCar/proximosServicios/', 'unidad=1063'],
              ['/ControlCar/proximosVencimientos/', 'unidad=1063'],
              ['/ControlCar/unidad/', 'unidad=1063'],
              ['/ControlCar/vehicle/', 'id=1063'],
            ];
            for (const [ep, body] of postEndpoints) {
              try {
                const r = await fetch(BASE + ep, {
                  method: 'POST',
                  headers: { Cookie: cookies, 'Content-Type': 'application/x-www-form-urlencoded', 'X-Requested-With': 'XMLHttpRequest' },
                  body: body,
                  redirect: 'manual',
                  signal: AbortSignal.timeout(8000),
                });
                let txt = '';
                if (r.status === 200) txt = (await r.text()).slice(0, 300).replace(/\\s+/g, ' ');
                const isJson = txt.trim().startsWith('{') || txt.trim().startsWith('[');
                console.log('  POST ' + ep + ' (' + body + ') → ' + r.status + (isJson ? ' [JSON]' : '') + ' ' + txt.slice(0, 150));
              } catch (e) {
                console.log('  POST ' + ep + ' (' + body + ') → ERR: ' + e.message);
              }
            }
            
            // Summary
            console.log('\n=== RESUMEN: ' + found.length + ' rutas encontradas ===');
            found.forEach(r => console.log('  ' + (r.status + '').padEnd(5) + ' ' + ((r.size||0)+'').padEnd(8) + r.path));
          }
          
          main().catch(e => { console.error('FATAL:', e.message); process.exit(1); });
          "
