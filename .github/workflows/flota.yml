name: Reporte de Flota

on:
  # Cada hora dentro del horario de trabajo (15:00-08:00 del día siguiente,
  # hora Perú / UTC-5 -> 20:00-13:00 UTC). GitHub Actions usa UTC por defecto.
  schedule:
    - cron: '0 20-23,0-13 * * *'
  workflow_dispatch:
    inputs:
      descubrir:
        description: "Explorar enlaces de la intranet (modo descubrimiento)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: "flota-sync"
  cancel-in-progress: false

jobs:
  flota:
    runs-on: ubuntu-latest
    env:
      BUDGET_USER: ${{ secrets.BUDGET_USER }}
      BUDGET_PASS: ${{ secrets.BUDGET_PASS }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # URL del panel (Convex): base + /ingest-flota. Ej:
      # https://3211-<workspace>.daytonaproxy01.net/ingest-flota
      CONVEX_SYNC_URL: ${{ secrets.CONVEX_SYNC_URL }}
      FLOTA_SYNC_SECRET: ${{ secrets.FLOTA_SYNC_SECRET }}
      # Modo descubrimiento (manual, con workflow_dispatch inputs.descubrir):
      # off en producción. La extracción de taller (inAndOut/list) es parte del flujo normal.
      DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Cache de agent-browser y Chrome
        uses: actions/cache@v6
        with:
          path: |
            ~/.agent-browser
            ~/.npm
          key: agentbrowser-${{ runner.os }}-v1
          restore-keys: |
            agentbrowser-${{ runner.os }}-

      - name: Instalar agent-browser
        # 0.34.0 fijado: versiones posteriores rompen eval con regex ("Invalid
        # regular expression: missing /"). Verificado localmente.
        run: |
          npm i -g agent-browser@0.34.0
          echo "$(npm config get prefix)/bin" >> "$GITHUB_PATH"

      - name: Instalar Chrome
        run: agent-browser install --with-deps

      - name: Extraer flota y generar snapshot
        # .cjs: package.json tiene "type": "module" y extraer_flota usa require() (CommonJS).
        run: node extraer_flota.cjs

      - name: Enviar flota al panel (Convex /ingest-flota)
        run: |
          code=""
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/sync_resp.json -w "%{http_code}" -X POST "$CONVEX_SYNC_URL" \
              -H "Content-Type: application/json" \
              -H "x-flota-secret: $FLOTA_SYNC_SECRET" \
              --data-binary @public/flota_data.json || true)
            echo "Intento $i: HTTP $code — $(cat /tmp/sync_resp.json)"
            if [ "$code" = "200" ]; then break; fi
            sleep 30
          done
          [ "$code" = "200" ] || { echo "::error::No se pudo sincronizar con el panel (HTTP $code)"; exit 1; }

      - name: Guardar cambios (si los hay)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/
          git commit -m "Actualizar flota $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "Sin cambios"
          git push
